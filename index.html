<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Adam Cassidy — Coming Soon</title>

    <!-- Geist + Geist Mono (Google Fonts) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <!-- Tailwind via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Tiny Tailwind config (still single-file) -->
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ["Geist", "ui-sans-serif", "system-ui"],
              mono: ["Geist Mono", "ui-monospace", "SFMono-Regular", "Menlo", "monospace"],
            },
          },
        },
      };
    </script>
  </head>

  <body class="min-h-screen bg-zinc-950 text-zinc-100 antialiased">
    <main class="flex min-h-screen items-center justify-center px-8">
      <section class="w-full max-w-xl space-y-16 text-center">
        <header class="space-y-7">
          <h1 class="text-4xl font-normal tracking-[-0.02em] sm:text-5xl">Adam Cassidy</h1>
          <p class="text-base font-normal leading-relaxed tracking-[0.005em] text-zinc-400 sm:text-lg">
            Senior UX Designer currently working on B2B payment products at WEX. Portfolio coming soon.
          </p>
        </header>

        <section class="space-y-6">
          <h2 class="font-mono text-xs uppercase tracking-[0.18em] text-zinc-500">Links</h2>
          <div class="space-y-4 text-sm sm:text-base">
            <p>
              <a
                href="mailto:adamkcassidy@gmail.com"
                class="font-normal tracking-[0.01em] underline decoration-zinc-500/70 underline-offset-4 transition-colors duration-200 hover:text-zinc-200 hover:decoration-zinc-300/70"
              >
                adamkcassidy@gmail.com
              </a>
            </p>
            <p>
              <a
                href="https://www.linkedin.com/in/adamkcassidy/"
                target="_blank"
                rel="noreferrer"
                class="font-normal tracking-[0.01em] underline decoration-zinc-500/70 underline-offset-4 transition-colors duration-200 hover:text-zinc-200 hover:decoration-zinc-300/70"
              >
                linkedin.com/in/adamkcassidy
              </a>
            </p>
          </div>
        </section>

        <footer>
          <p class="text-sm tracking-[0.01em] text-zinc-500">Built with Cursor and Tailwind. Deployed via Netlify.</p>
        </footer>
      </section>
    </main>
  </body>
</html>
